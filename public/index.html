<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Resilify — Control Plane</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  body { font-family: 'Courier New', monospace; background: #0d1117; color: #c9d1d9; padding: 24px; }
  h1 { color: #58a6ff; }
  #stats { font-size: 18px; margin-bottom: 20px; padding: 12px; border: 1px solid #30363d; border-radius: 8px; }
  .instance { border: 1px solid #30363d; border-left-width: 6px; padding: 12px; margin: 10px 0; border-radius: 6px; }
  .healthy { border-left-color: #3fb950; }
  .failed { border-left-color: #f85149; background: rgba(248,81,73,0.08); }
  .starting { border-left-color: #d29922; }
  button { margin-right: 8px; margin-top: 6px; padding: 6px 14px; cursor: pointer; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; }
  button:hover { background: #30363d; }
  .metrics { color: #8b949e; font-size: 14px; margin-top: 4px; }
  #controls { margin-bottom: 20px; }
</style>
</head>
<body>
  <h1>🛰️ Resilify Control Plane</h1>

  <div id="stats">Loading...</div>

  <div id="controls">
    <button onclick="simulateLoad()">⚡ SIMULATE LOAD (100 req)</button>
  </div>

  <div id="instances"></div>

<script>
  const socket = io();

  socket.on('state', (data) => {
    const s = data.stats;
    document.getElementById('stats').innerText =
      `Availability: ${s.availability.toFixed(1)}%  |  Total requests: ${s.totalRequests}  |  Recovered: ${s.recoveredRequests}`;

    const container = document.getElementById('instances');
    container.innerHTML = '';

    data.instances.forEach((inst) => {
      const cls = inst.status === 'HEALTHY' ? 'healthy'
                : inst.status === 'FAILED' ? 'failed'
                : 'starting';

      const icon = inst.status === 'HEALTHY' ? '●' : inst.status === 'FAILED' ? '🔴' : '◐';

      const div = document.createElement('div');
      div.className = 'instance ' + cls;
      div.innerHTML = `
        <b>${icon} ${inst.id}</b> — ${inst.status} — port ${inst.port}
        <div class="metrics">
          CPU: ${inst.cpu}% &nbsp;|&nbsp; Memory: ${inst.memoryMB}MB &nbsp;|&nbsp;
          Requests: ${inst.requests} &nbsp;|&nbsp; RPS: ${inst.rps} &nbsp;|&nbsp;
          Avg latency: ${inst.avgLatencyMs}ms &nbsp;|&nbsp; Uptime: ${inst.uptimeSec}s
        </div>
        <button onclick="kill('${inst.id}')">KILL SERVER</button>
        <button onclick="revive('${inst.id}')">REVIVE SERVER</button>
      `;
      container.appendChild(div);
    });
  });

  function kill(id) {
    fetch('/api/kill/' + id, { method: 'POST' });
  }
  function revive(id) {
    fetch('/api/revive/' + id, { method: 'POST' });
  }
  function simulateLoad() {
    fetch('/api/simulate-load', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ count: 100 }),
    });
  }
</script>
</body>
</html>
